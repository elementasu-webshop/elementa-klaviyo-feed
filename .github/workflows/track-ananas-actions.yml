name: Track Ananas promotion dates
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ananas-promo-date-tracker
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5
      - run: python track_akcije.py
      - name: Persist dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add akcije_datumi.json
          if ! git diff --cached --quiet; then
            git commit -m "Update first-seen Ananas promotion dates"
            git push
          fi
